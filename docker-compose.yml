services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # SECRET_KEY fica so no backend/.env: o que esta aqui em "environment"
      # vence o env_file, e o valor de exemplo fazia o backend sortear uma
      # chave nova a cada restart (derrubando os cookies de acesso).
      - DATABASE_URL=sqlite:////app/data/ponto.db
      - DATABASE_PATH=/app/data/ponto.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/service-account.json:/app/service-account.json:ro
      - ./frontend/assets:/app/frontend/assets:ro
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
