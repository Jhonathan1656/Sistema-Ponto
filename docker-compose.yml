services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # SECRET_KEY fica so no backend/.env: o que esta aqui em "environment"
      # vence o env_file, e o valor de exemplo fazia o backend sortear uma
      # chave nova a cada restart (derrubando os cookies de acesso).
      - DATABASE_URL=sqlite:////app/data/ponto.db
      - DATABASE_PATH=/app/data/ponto.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/service-account.json:/app/service-account.json:ro
      - ./frontend/assets:/app/frontend/assets:ro
    # "always" e nao "unless-stopped": com unless-stopped, um container parado
    # a mao uma unica vez nunca mais volta - nem depois de reboot. Numa maquina
    # que precisa se recuperar sozinha depois de queda de energia isso e uma
    # bomba-relogio silenciosa.
    restart: always
    healthcheck:
      # python-slim nao tem curl nem wget; usa o proprio interpretador.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # O boot depois de uma queda e lento (disco frio, WSL2 subindo).
      start_period: 60s

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        # Sem isso o nginx sobe antes da API e resolve "backend" pro nada,
        # devolvendo 502 nos primeiros acessos depois do boot.
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
