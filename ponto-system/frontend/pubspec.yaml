name: ponto_app
description: Sistema de Registro de Ponto
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.1.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.1.4
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  fl_chart: ^0.65.0
  
  # Location (opcional)
  geolocator: ^10.1.0
  
  # PDF & Office
  pdf: ^3.10.7
  path_provider: ^2.1.1
  excel: 2.1.0
  file_saver: ^0.2.10
  file_picker: ^8.1.7
  record: ^7.0.0
  flutter_email_sender: ^9.0.0
  url_launcher: ^6.3.2
  firebase_storage: ^12.4.10
  audioplayers: ^6.7.1
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

