server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /pwa_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(js|mjs|wasm|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/ {
        auth_request /access-check;
        error_page 401 = @access_unlock;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11m;
        proxy_read_timeout 90s;
    }

    location / {
        auth_request /access-check;
        error_page 401 = @access_unlock;
        try_files $uri /index.html;
    }

    location = /access-check {
        internal;
        proxy_pass http://backend:8000/access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /access/unlock {
        proxy_pass http://backend:8000/access/unlock$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /access/login {
        proxy_pass http://backend:8000/access/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @access_unlock {
        return 302 /access/unlock?next=$request_uri;
    }
}
